server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: merchant-portal-v2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Database Base Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.11.101:3306/mobiversa?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:devadmin}
    password: ${DB_PASSWORD:Passw0r6}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MerchantHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: none # Do not alter legacy schema
    show-sql: false
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

# AWS Secrets Manager Configuration
aws:
  secretsmanager:
    enabled: ${AWS_SECRETS_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-1}
    secret-name: ${AWS_SECRET_NAME:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# JWT Security Configuration
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signature
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiration in milliseconds: 8 hours = 28,800,000 ms
    expiration-ms: 28800000
    # Name of the HttpOnly cookie
    cookie-name: mobi_jwt_token

# Payment OTP Gateway & Security Configuration
payment:
  api:
    url: ${PAYMENT_API_URL:https://api.mobiversa.com/payment/otp}

otp:
  ttl-seconds: ${OTP_TTL_SECONDS:70}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  hmac:
    secret: ${OTP_HMAC_SECRET:c489725b8214f48b8bb9bce413c242095f3a02a927a4242fe125b2f8319f3a64}
  rate-limit:
    max-requests: ${OTP_RATE_LIMIT_MAX_REQUESTS:3}
    window-ms: ${OTP_RATE_LIMIT_WINDOW_MS:300000}
    cooldown-ms: ${OTP_RATE_LIMIT_COOLDOWN_MS:60000}

password:
  policy:
    min-length: ${PASSWORD_POLICY_MIN_LENGTH:12}
  reset:
    token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:600}
