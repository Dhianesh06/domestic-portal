# Local Development Profile
# By default, supports either local DB credentials (from .env or env vars) or local AWS Secrets Manager via static credentials/profile

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

aws:
  secretsmanager:
    # Set to true if testing AWS Secrets Manager locally
    enabled: ${AWS_SECRETS_ENABLED:false}
    region: ${AWS_REGION:ap-southeast-1}
    secret-name: ${AWS_SECRET_NAME:domestic-portal/local/db-credentials}
    # Static keys for local testing if not using ~/.aws/credentials
    access-key: ${AWS_ACCESS_KEY_ID:1234}
    secret-key: ${AWS_SECRET_ACCESS_KEY:2345}

