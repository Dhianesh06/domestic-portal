<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mobi | Forgot Password</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/newMobiMIcon.svg}" href="/images/newMobiMIcon.svg"/>

    <!-- Google Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5fa;
            background-image: radial-gradient(#dbe7f5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .fp-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 94, 168, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
        }
        .brand-logo {
            height: 38px;
            margin-bottom: 1.5rem;
        }
        .btn-mobi {
            background-color: #0f5ea8;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            width: 100%;
        }
        .btn-mobi:hover {
            background-color: #0a4680;
            color: #ffffff;
        }
        .back-link {
            color: #0f5ea8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="fp-card">
    <div class="text-center">
        <!-- Logo -->
        <img th:src="@{/images/mobi-new-logo.svg}" src="/images/mobi-new-logo.svg" alt="Mobi" class="brand-logo"/>
        <h4 class="fw-bold text-dark mb-2">Forgot Password</h4>
        <p class="text-muted small mb-4">Enter your username and we will send a verification code to your registered mobile number.</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
        <span th:text="${errorMessage}">Error occurred</span>
    </div>

    <!-- Info / Generic anti-enumeration Alert -->
    <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
        <span th:text="${infoMessage}">If your account is registered, an OTP has been sent.</span>
    </div>

    <!-- Forgot Password Form -->
    <form th:action="@{/v1/forgot-password/send-otp}" th:object="${forgotPasswordRequest}" method="post">
        <!-- CSRF Token automatically injected by Thymeleaf -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   class="form-control"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required autofocus />
            <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></div>
        </div>

        <button type="submit" class="btn btn-mobi mb-3">Send OTP</button>

        <div class="text-center">
            <a th:href="@{/auth/login}" class="back-link">&larr; Back to Login</a>
        </div>
    </form>
</div>

</body>
</html>
