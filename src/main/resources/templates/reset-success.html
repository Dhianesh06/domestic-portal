<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mobi | Password Reset Successful</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/newMobiMIcon.svg}" href="/images/newMobiMIcon.svg"/>

    <!-- Google Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5fa;
            background-image: radial-gradient(#dbe7f5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .fp-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 94, 168, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .brand-logo {
            height: 38px;
            margin-bottom: 1.5rem;
        }
        .success-icon-wrap {
            width: 70px;
            height: 70px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 1.5rem auto;
        }
        .btn-mobi {
            background-color: #0f5ea8;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            width: 100%;
            text-decoration: none;
            display: inline-block;
        }
        .btn-mobi:hover {
            background-color: #0a4680;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="fp-card">
    <!-- Logo -->
    <img th:src="@{/images/mobi-new-logo.svg}" src="/images/mobi-new-logo.svg" alt="Mobi" class="brand-logo"/>

    <div class="success-icon-wrap">
        &#10004;
    </div>

    <h4 class="fw-bold text-dark mb-2">Password Changed!</h4>
    <p class="text-muted small mb-4">
        Your merchant password has been successfully updated. All active sessions have been signed out for security.
    </p>

    <a th:href="@{/auth/login}" class="btn-mobi">Back to Login</a>
</div>

</body>
</html>
