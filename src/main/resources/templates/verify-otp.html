<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mobi | Verify OTP</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/newMobiMIcon.svg}" href="/images/newMobiMIcon.svg"/>

    <!-- Google Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5fa;
            background-image: radial-gradient(#dbe7f5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .fp-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 94, 168, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
        }
        .brand-logo {
            height: 38px;
            margin-bottom: 1.5rem;
        }
        .btn-mobi {
            background-color: #0f5ea8;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            width: 100%;
        }
        .btn-mobi:hover {
            background-color: #0a4680;
            color: #ffffff;
        }
        .otp-input {
            letter-spacing: 8px;
            font-size: 24px;
            text-align: center;
            font-weight: 700;
        }
        .timer-badge {
            font-size: 13px;
            color: #e89b23;
            font-weight: 600;
        }
        .btn-resend {
            color: #0f5ea8;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }
        .btn-resend:disabled {
            color: #999999;
            cursor: not-allowed;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="fp-card">
    <div class="text-center">
        <!-- Logo -->
        <img th:src="@{/images/mobi-new-logo.svg}" src="/images/mobi-new-logo.svg" alt="Mobi" class="brand-logo"/>
        <h4 class="fw-bold text-dark mb-2">Verify OTP</h4>
        <p class="text-muted small mb-3">
            Please enter the 6-digit code sent to
            <strong th:text="${maskedContact}">your phone</strong>.
        </p>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
        <span th:text="${errorMessage}">Error verifying code</span>
    </div>

    <!-- Info Alert -->
    <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
        <span th:text="${infoMessage}">Code sent</span>
    </div>

    <!-- OTP Form -->
    <form th:action="@{/v1/forgot-password/verify-otp}" th:object="${verifyOtpRequest}" method="post" id="otpForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label for="otp" class="form-label small fw-semibold text-secondary">One-Time Password</label>
            <input type="text"
                   id="otp"
                   th:field="*{otp}"
                   class="form-control otp-input"
                   placeholder="------"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   inputmode="numeric"
                   autocomplete="one-time-code"
                   required autofocus />
            <div th:if="${#fields.hasErrors('otp')}" class="text-danger small mt-1" th:errors="*{otp}"></div>
        </div>

        <!-- Countdown Timer -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="timer-badge">
                Expires in: <span id="countdown">01:10</span>
            </span>
            <button type="button" id="resendBtn" class="btn-resend" onclick="resendOtp()" disabled>
                Resend OTP (<span id="cooldownSec">60</span>s)
            </button>
        </div>

        <button type="submit" class="btn btn-mobi mb-3" id="verifyBtn">Verify & Proceed</button>

        <div class="text-center">
            <a th:href="@{/v1/forgot-password}" class="text-secondary small text-decoration-none">&larr; Change Username</a>
        </div>
    </form>

    <!-- Hidden form for Resend OTP -->
    <form id="resendForm" th:action="@{/v1/forgot-password/send-otp}" method="post" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>
</div>

<!-- Countdown and Resend Cooldown Script -->
<script th:inline="javascript">
    /*<![CDATA[*/
    var otpSeconds = /*[[${otpTtlSeconds}]]*/ 70;
    var cooldownSeconds = /*[[${resendCooldownSeconds}]]*/ 60;
    /*]]>*/

    var countdownEl = document.getElementById('countdown');
    var resendBtn = document.getElementById('resendBtn');
    var cooldownSecEl = document.getElementById('cooldownSec');
    var verifyBtn = document.getElementById('verifyBtn');

    // 1. OTP Expiry Countdown (70 seconds)
    var timerInterval = setInterval(function() {
        if (otpSeconds <= 0) {
            clearInterval(timerInterval);
            countdownEl.textContent = "Expired";
            countdownEl.classList.add("text-danger");
            verifyBtn.disabled = true;
        } else {
            var m = Math.floor(otpSeconds / 60);
            var s = otpSeconds % 60;
            countdownEl.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
            otpSeconds--;
        }
    }, 1000);

    // 2. Resend Button Cooldown (60 seconds)
    var cooldownInterval = setInterval(function() {
        if (cooldownSeconds <= 0) {
            clearInterval(cooldownInterval);
            resendBtn.disabled = false;
            resendBtn.textContent = "Resend OTP";
        } else {
            cooldownSecEl.textContent = cooldownSeconds;
            cooldownSeconds--;
        }
    }, 1000);

    function resendOtp() {
        window.location.href = /*[[@{/v1/forgot-password}]]*/ "/v1/forgot-password";
    }
</script>

</body>
</html>
