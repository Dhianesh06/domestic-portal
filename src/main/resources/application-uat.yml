# UAT Environment Profile
# Credentials retrieved dynamically via IAM Role from AWS Secrets Manager

spring:
  jpa:
    show-sql: false

aws:
  secretsmanager:
    enabled: ${AWS_SECRETS_ENABLED:true}
    region: ${AWS_REGION:ap-southeast-1}
    secret-name: ${AWS_SECRET_NAME:domestic-portal/uat/db-credentials}

